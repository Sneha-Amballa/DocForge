# DocForge Configuration File - Phase 1

dataset:
  root_path: "dataset"
  training_set: "dataset/DocTamperV1-TrainingSet"
  testing_set: "dataset/DocTamperV1-TestingSet"
  scd_set: "dataset/DocTamperV1-SCD"
  fcd_set: "dataset/DocTamperV1-FCD"

preprocessing:
  image_size: [512, 512]
  preserve_aspect_ratio: true
  padding_enabled: true
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]

augmentation:
  enabled: true
  horizontal_flip: false
  rotation_limit: 10
  brightness_limit: 0.15
  contrast_limit: 0.15
  gaussian_noise_var: 15.0
  jpeg_compression_quality_min: 60
  jpeg_compression_quality_max: 95
  gaussian_blur_limit: 3
  motion_blur_limit: 3
  perspective_limit: 0.04
  random_crop_enabled: false
  random_crop_height: 480
  random_crop_width: 480

dataloader:
  batch_size: 4
  shuffle: true
  num_workers: 0
  pin_memory: true
  persistent_workers: false

model:
  processor_name: "Qwen/Qwen2-VL-2B-Instruct"
  prompt_template: "Detect document tampering."

split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42

outputs:
  root_path: "outputs"
  overlays_dir: "outputs/overlays"
  samples_dir: "outputs/samples"
  reports_dir: "outputs/reports"
  statistics_dir: "outputs/statistics"
  checkpoints_dir: "outputs/checkpoints"

training:
  epochs: 3
  learning_rate: 0.0002
  weight_decay: 0.01
  gradient_accumulation_steps: 2
  grad_clip_norm: 1.0
  precision: "fp32"       # fp32, fp16, bf16
  scheduler_type: "cosine" # cosine, linear, constant
  warmup_steps: 100
  checkpoint_interval: 1   # epoch interval
  early_stopping_patience: 3
  logging_backends: ["tensorboard", "terminal"]
  dry_run: false           # enables rapid 5-step mock loop

